- defaults:
    link:
      relink: true
      create: true

- link:
    ~/.gitconfig: gitconfig
    ~/.config/fish/:
        path: config/fish/*
        glob: true
    ~/.config/environment.d/:
        path: config/environment.d/*
        glob: true
    ~/.config/systemd/user/:
        path: config/systemd/user/*
        glob: true
    ~/.config/mise/config.toml: config/mise/config.toml
    ~/.pi/agent/settings.json: config/pi/settings.json
    ~/.pi/agent/mcp.json: config/pi/mcp.json
    ~/.pi/agent/AGENTS.md: config/pi/AGENTS.md
    ~/.agents/gemma-helper.md: config/pi/gemma-helper.md
